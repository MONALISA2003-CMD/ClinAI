name: Extract New ZIP and Replace Application

on:
  push:
    paths:
      - "*.zip"
      - "releases/*.zip"
      - ".github/workflows/deploy-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" \
            ! -path "./.git/*" \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP selected: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare temporary extraction directory
        run: |
          rm -rf .zip-extract
          mkdir -p .zip-extract

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          unzip -q "$ZIP_FILE" -d .zip-extract

          echo "ZIP extracted successfully."

      - name: Detect nested single root directory
        shell: bash
        run: |
          set -e

          cd .zip-extract

          ITEMS=$(find . -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ]; then
            ITEM=$(find . -mindepth 1 -maxdepth 1 -print)

            if [ -d "$ITEM" ]; then
              echo "ZIP contains one root directory."
              echo "Flattening: $ITEM"

              shopt -s dotglob
              mv "$ITEM"/* .
              rmdir "$ITEM"
            fi
          fi

      - name: Remove previous application files
        shell: bash
        run: |
          set -e

          echo "Removing previous application files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".zip-extract" \
            ! -name ".gitignore" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          echo "Previous application files removed."

      - name: Copy new application
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          if [ -z "$(find .zip-extract -mindepth 1 -print -quit)" ]; then
            echo "Extracted ZIP is empty."
            exit 1
          fi

          cp -R .zip-extract/* .

          echo "New application files copied."

      - name: Remove temporary files
        run: |
          rm -rf .zip-extract

      - name: Remove ZIP releases after extraction
        shell: bash
        run: |
          set -e

          find . -maxdepth 2 -type f -name "*.zip" \
            ! -path "./.git/*" \
            -delete

          echo "ZIP files removed."

      - name: Show resulting repository
        run: |
          echo "Repository after extraction:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit extracted application
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: replace application from new ZIP"
          git push
