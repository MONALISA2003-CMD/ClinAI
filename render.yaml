services:
  - type: web
    name: clinai-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --no-audit --no-fund --progress=false && npm run build:api && test -f services/api/build/services/api/src/main.js && node scripts/api-build-artifact-audit.mjs && echo 'ClinAI API runtime artifact verified'
    startCommand: node services/api/build/services/api/src/main.js
    healthCheckPath: /health

  - type: web
    name: clinai-intelligence-engine
    runtime: docker
    plan: free
    rootDir: services/intelligence
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: clinai-ai-service
    runtime: docker
    plan: free
    rootDir: services/ai
    dockerfilePath: Dockerfile
    healthCheckPath: /health
