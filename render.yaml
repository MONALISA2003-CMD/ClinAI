services:
  - type: web
    name: clinai-api
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build:api
    startCommand: npm --workspace @clinai/api run start
    healthCheckPath: /health

  - type: web
    name: clinai-intelligence-engine
    runtime: docker
    plan: free
    rootDir: services/intelligence
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: clinai-ai-service
    runtime: docker
    plan: free
    rootDir: services/ai
    dockerfilePath: Dockerfile
    healthCheckPath: /health
